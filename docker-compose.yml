version: '3.9'

services:
  # ============================================================
  # PostgreSQL with pgvector
  # ============================================================
  db:
    image: pgvector/pgvector:pg16
    container_name: attender_db
    environment:
      POSTGRES_DB: attender
      POSTGRES_USER: attender
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attender"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis (JWT refresh token store + rate limiting)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: attender_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ============================================================
  # FastAPI Backend
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attender_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://attender:${DB_PASSWORD:-devpassword}@db:5432/attender
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      LIVENESS_TOKEN_SECRET: ${LIVENESS_TOKEN_SECRET:-dev-liveness-secret}
      APP_ENV: development
      DEBUG: "true"
    volumes:
      - ./backend:/app
      - ml_models:/app/app/ml/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================
  # React Frontend (dev server)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: attender_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  ml_models:
